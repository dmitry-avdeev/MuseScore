name: 'Legato: diagnose mscore MIDI hang'

# Downloads the released patched AppImage and runs it headless under xvfb to
# reproduce the MIDI (.mid) export HANG seen on the HuggingFace Space (layout
# .musicxml exits fine, .mid times out at 40s). Differential: same minimal score
# to .musicxml (should exit fast) vs .mid; if .mid hangs, snapshot every mscore
# thread's stack via a gdb attach so we can see where it blocks.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb gdb dbus-x11 libxcb-cursor0 libopengl0 \
            libegl1 libgl1-mesa-dri libnss3 libasound2t64 psmisc

      - name: Download + extract released AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download legato-linux-x64 --repo "${{ github.repository }}" \
            --pattern '*x86_64*.AppImage' --output mscore.AppImage
          chmod +x mscore.AppImage
          ./mscore.AppImage --appimage-extract >/dev/null
          echo "extracted:"; ls squashfs-root/AppRun

      - name: Minimal score
        run: |
          cat > in.musicxml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <score-partwise version="4.0">
            <part-list><score-part id="P1"><part-name>P</part-name></score-part></part-list>
            <part id="P1"><measure number="1">
              <attributes><divisions>1</divisions><key><fifths>0</fifths></key>
                <time><beats>4</beats><beat-type>4</beat-type></time>
                <clef><sign>G</sign><line>2</line></clef></attributes>
              <note><pitch><step>C</step><octave>5</octave></pitch><duration>4</duration><type>whole</type></note>
            </measure></part>
          </score-partwise>
          XML

      - name: Baseline — MusicXML export (expected fast)
        run: |
          export HOME="$PWD/h"; mkdir -p "$HOME"
          t0=$(date +%s)
          timeout 60 xvfb-run -a ./squashfs-root/AppRun in.musicxml -o out.musicxml \
            && echo "musicxml exit=0" || echo "musicxml exit=$? (124=timeout)"
          echo "elapsed=$(( $(date +%s) - t0 ))s"
          ls -la out.musicxml 2>&1 || echo "no musicxml output"

      - name: Inspect inner binary + AppRun env
        run: |
          BIN=$(find squashfs-root -maxdepth 3 -name 'mscore*portable*' -type f | head -1)
          echo "BIN=$BIN" | tee -a "$GITHUB_ENV"
          file "$BIN" || true
          echo "=== AppRun exports ==="; grep -nE 'export|LD_LIBRARY|QT_|APPDIR' squashfs-root/AppRun | head -40 || true
          echo "=== renderScore symbol present? ==="
          gdb -batch -ex 'info functions renderScore' "$BIN" 2>&1 | head -20 || true

      - name: MIDI export — snapshot the runaway mid-allocation (debug_info bt)
        run: |
          export HOME="$PWD/h2"; mkdir -p "$HOME"
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          # Run via AppRun (correct bundled env) under xvfb. It starts fine, then the
          # MIDI render runs away allocating and aborts ~25s in. Attach at 8s — well
          # into the runaway but before the abort — so the (unstripped) bt shows the
          # loop doing the allocation, not the post-abort terminate handler.
          # Runaway is ~1.6 GB/s (12.8 GB / 8s), so poll fast: attach every ~0.7s
          # from t=1s and grab a bt until the process aborts. Whichever snapshot
          # lands mid-loop gives the symbolized allocation stack.
          xvfb-run -a bash -c '
            ./squashfs-root/AppRun in.musicxml -o out.mid & APP=$!
            for i in $(seq 1 14); do
              p=$(pgrep -f "[m]score4portable" | head -1)
              if [ -z "$p" ]; then echo "=== mscore gone at iter $i ==="; break; fi
              rss=$(ps -o rss= -p "$p" 2>/dev/null)
              echo "############ iter=$i pid=$p rss=${rss}kB ############"
              gdb -batch -p "$p" -ex "bt 45" 2>&1 | grep -vE "Thread debugging|libthread_db|^\[New|^0x.* in \?\?|Using host" | head -60
              sleep 0.7
            done
            kill -9 $APP 2>/dev/null || true; pkill -9 -f "[m]score" 2>/dev/null || true
          '
          echo "=== output? ==="; ls -la out.mid 2>&1 || echo "no mid output"
