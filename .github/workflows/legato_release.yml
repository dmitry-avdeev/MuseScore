name: 'Legato: build + release Linux mscore'

# Builds the patched MuseScore for linux x86_64 (reusing the upstream Linux build
# workflow) and publishes the resulting AppImage as a GitHub Release, so the
# HuggingFace Legato Space can download it for its MusicXML layout pass.

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build_linux.yml
    with:
      platforms: linux_x64
      build_mode: devel
      publish: 'off'
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Publish AppImage to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          appimage=$(find artifacts -iname '*.AppImage' | head -1)
          if [ -z "$appimage" ]; then
            echo "No AppImage found in artifacts" >&2
            exit 1
          fi
          echo "Publishing: $appimage"
          gh release delete legato-linux-x64 --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create legato-linux-x64 \
            "${appimage}#MuseScore-legato-x86_64.AppImage" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Legato MuseScore (linux x86_64)" \
            --notes "Patched MuseScore for the Legato MusicXML layout pass (branch legato-musicxml-positions). Built by the legato_release workflow."
